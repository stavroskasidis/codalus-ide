name: Setup
description: >-
  The .NET SDK of global.json, and what a job asks for: the extra SDKs, the NuGet cache, the debugger, the macOS
  developer tools access and a display (Xvfb on Linux, a 1920x1080 screen on Windows). Every workflow's jobs set up
  through it, so each pin lives here once.
inputs:
  extra-sdks:
    description: >-
      Also the .NET 10 SDK, for the fixtures that still target net10.0 and the net10.0 half of samples/Testing (M30b)
    default: "false"
  nuget-cache:
    description: >-
      Restore ~/.nuget/packages from the cache (only jobs that restore the solution). Nothing saves it here: one job per OS
      saves it on develop with the outputs below (pull requests' copies evicted each other, and every job spent minutes
      packing a cache that another job was already saving)
    default: "false"
  netcoredbg:
    description: The debugger (eng/get-netcoredbg.sh, pinned and checksummed) in .work/netcoredbg
    default: "false"
  devtools:
    description: macOS developer tools access, for dumps (createdump) and attaching (netcoredbg)
    default: "false"
  display:
    description: An X server on Linux (Xvfb on :99, DISPLAY set for the job's later steps), a 1920x1080 screen on Windows
    default: "false"
  downloads:
    description: >-
      Node.js and vscode-js-debug from the cache (CODALUS_DOWNLOAD_CACHE, set for the job's later steps), so the tests
      and the smoke test don't wait on nodejs.org and github.com: a stalled download of Node.js failed the macOS smoke
      test (run 40632085595). On a miss eng/get-downloads.sh fetches them; the job saves the folder with the outputs below
    default: "false"
outputs:
  nuget-cache-key:
    description: The NuGet cache's key, for the job that saves it
    value: ${{ steps.restore-nuget.outputs.cache-primary-key }}
  nuget-cache-hit:
    description: '"true" when the cache had that key exactly (nothing to save)'
    value: ${{ steps.restore-nuget.outputs.cache-hit }}
  downloads-key:
    description: The downloads cache's key, for the step that saves it
    value: ${{ steps.restore-downloads.outputs.cache-primary-key }}
  downloads-hit:
    description: '"true" when the downloads cache had that key exactly (nothing to save)'
    value: ${{ steps.restore-downloads.outputs.cache-hit }}
runs:
  using: composite
  steps:
    # The SDK of global.json, spelled out: setup-dotnet reads global.json's "latestFeature" as the channel's newest
    # release, which .NET 11 doesn't have before GA (M30b). Keep it in step with global.json and samples/Net11/global.json
    # (docs/release/dotnet-upgrade.md). TODO(issue): back to global-json-file on the .NET 11 GA SDK.
    - if: inputs.extra-sdks != 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.100-rc.3.26522.148
    - if: inputs.extra-sdks == 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x
          11.0.100-rc.3.26522.148
    - if: inputs.nuget-cache == 'true'
      id: restore-nuget
      uses: actions/cache/restore@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-
    - if: inputs.netcoredbg == 'true'
      id: netcoredbg-key
      # The key from the script's own hash, not hashFiles: the cache's post step evaluates its key again after the job,
      # and hashFiles walks the whole workspace, which failed on Windows while processes the tests left were still
      # changing files there ("Fail to hash files under directory", develop's run 39927358842).
      shell: bash
      run: echo "hash=$(sha256sum eng/get-netcoredbg.sh | cut -c1-64)" >> "$GITHUB_OUTPUT"
    - if: inputs.netcoredbg == 'true'
      uses: actions/cache@v4
      with:
        path: .work/netcoredbg
        key: netcoredbg-${{ runner.os }}-${{ runner.arch }}-${{ steps.netcoredbg-key.outputs.hash }}
    - name: Debugger (netcoredbg, pinned and checksummed)
      if: inputs.netcoredbg == 'true'
      shell: bash
      run: eng/get-netcoredbg.sh
    - if: inputs.downloads == 'true'
      id: downloads-key
      # The pinned versions and checksums are in these two files (the key from their own hash, as netcoredbg's above).
      shell: bash
      run: |
        echo "hash=$(cat src/Codalus.Workbench/Node/NodeRuntime.cs src/Codalus.Workbench/Node/JsDebug.cs | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
        echo "CODALUS_DOWNLOAD_CACHE=$RUNNER_TEMP/codalus-downloads" >> "$GITHUB_ENV"
    - if: inputs.downloads == 'true'
      id: restore-downloads
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/codalus-downloads
        key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ steps.downloads-key.outputs.hash }}
    - name: Downloads (Node.js, vscode-js-debug)
      # Not in the cache yet (new versions): fetched here, resumed when they stall, with time of their own, instead of
      # inside a test's minutes. Should it fail, the tests download them themselves.
      if: inputs.downloads == 'true' && steps.restore-downloads.outputs.cache-hit != 'true'
      continue-on-error: true
      shell: bash
      run: eng/get-downloads.sh "$RUNNER_TEMP/codalus-downloads"
    - name: Developer tools access (macOS)
      # Otherwise the system asks for a password that nobody answers on a runner, and dumps and attaching time out (as
      # a person would approve once). The windowed app runs in the runner's GUI session, where the task port right
      # still asked with developer mode on: allowed only on these throwaway runners (the maintainer's decision, 2026-10-12).
      if: inputs.devtools == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        sudo DevToolsSecurity -enable
        sudo dseditgroup -o edit -a "$USER" -t user _developer
        sudo security authorizationdb write system.privilege.taskport allow
    - name: Display (Xvfb)
      # One X server for the whole job, so the steps run the same command on every OS (no xvfb-run around each).
      if: inputs.display == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        command -v Xvfb > /dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb; }
        Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
        for _ in $(seq 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
        [ -S /tmp/.X11-unix/X99 ] || { cat "$RUNNER_TEMP/xvfb.log"; echo "::error::Xvfb didn't start"; exit 1; }
        echo "DISPLAY=:99" >> "$GITHUB_ENV"
    - name: Display (1920x1080 on Windows)
      # The runner's screen is 1024x768, which shrinks the smoke test's 1280x800 window, and the website's pictures from
      # it (website/screenshots.txt), to 1028x780. Xvfb's size, through ChangeDisplaySettings; when the driver refuses, a
      # warning (the smoke test says its window's size too), not a failed job.
      if: inputs.display == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        Add-Type -TypeDefinition @'
        using System.Runtime.InteropServices;
        public static class CodalusDisplay
        {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
            private struct DevMode
            {
                [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string DeviceName;
                public short SpecVersion, DriverVersion, Size, DriverExtra;
                public int Fields, PositionX, PositionY, DisplayOrientation, DisplayFixedOutput;
                public short Color, Duplex, YResolution, TTOption, Collate;
                [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string FormName;
                public short LogPixels;
                public int BitsPerPel, PelsWidth, PelsHeight, DisplayFlags, DisplayFrequency;
                public int IcmMethod, IcmIntent, MediaType, DitherType, Reserved1, Reserved2, PanningWidth, PanningHeight;
            }

            [DllImport("user32.dll", CharSet = CharSet.Unicode)]
            private static extern bool EnumDisplaySettings(string device, int mode, ref DevMode devMode);

            [DllImport("user32.dll", CharSet = CharSet.Unicode)]
            private static extern int ChangeDisplaySettings(ref DevMode devMode, int flags);

            // DISP_CHANGE_SUCCESSFUL (0), or the error; -100 when the current mode can't be read.
            public static int Set(int width, int height)
            {
                var mode = new DevMode { Size = (short)Marshal.SizeOf<DevMode>() };
                if (!EnumDisplaySettings(null, -1, ref mode)) // ENUM_CURRENT_SETTINGS
                {
                    return -100;
                }

                mode.PelsWidth = width;
                mode.PelsHeight = height;
                mode.Fields = 0x80000 | 0x100000; // DM_PELSWIDTH | DM_PELSHEIGHT
                return ChangeDisplaySettings(ref mode, 0);
            }
        }
        '@
        $result = [CodalusDisplay]::Set(1920, 1080)
        Add-Type -AssemblyName System.Windows.Forms
        $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
        Write-Output "ChangeDisplaySettings: $result; the screen: $($screen.Width)x$($screen.Height)"
        if ($screen.Width -lt 1920 -or $screen.Height -lt 1080) {
          Write-Output "::warning::The screen stayed $($screen.Width)x$($screen.Height) (ChangeDisplaySettings: $result): the smoke test's pictures are smaller than the website's 1280x800."
        }
