name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A small solution or project that shows the problem helps most.
      placeholder: |
        1. Open ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Codalus IDE version
      description: Help → About, or `codalus --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: .NET SDK version
      description: "`dotnet --version` in the solution's folder."
  - type: textarea
    id: logs
    attributes:
      label: Logs and crash reports
      description: |
        Relevant output from View → Output (Codalus IDE, Build Host, Language Services, Git or Debug channels).
        If crash reports are enabled, attach the file from Help → Open Crash Reports Folder (review it first: it contains stack traces and file paths).
      render: text
