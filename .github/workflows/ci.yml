name: CI

# The repository is public, so GitHub-hosted minutes are free: every push and pull request runs the full
# Windows/macOS/Linux matrix, in parallel jobs (tests in three shards, and the smoke test) per OS. While the repository
# was private, pushes ran Linux only (the matrix job below keeps that rule for a private repository).
on:
  push:
    branches: [develop, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [develop, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.event.repository.private }}" == "true" ]]; then
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          fi

  # The tests in three shards per OS on separate runners at the same time (eng/ci-test.sh): the Shell tests in two
  # halves (they take 15 to 25 minutes on their own) and every other project. With the smoke test on a runner of its
  # own, a run takes as long as its longest job, not the sum of them (it took 55 minutes on Windows).
  test:
    needs: matrix
    name: test (${{ matrix.os }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.os) }}
        shard: [shell-1, shell-2, others]
    runs-on: ${{ matrix.os }}
    # The manual matrix run also installs and runs the target framework matrix (M33).
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 90 || 50 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          # samples/Testing has a multi-targeted test project (net9.0;net10.0). samples/Net11 needs the .NET 11 SDK
          # (M30): keep it in step with samples/Net11/global.json (docs/release/dotnet-upgrade.md).
          dotnet-version: |
            9.0.x
            11.0.100-rc.1.26425.128
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: .work/netcoredbg
          key: netcoredbg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('eng/get-netcoredbg.sh') }}
      - name: Debugger (netcoredbg, pinned and checksummed)
        shell: bash
        run: eng/get-netcoredbg.sh
      - name: Target framework matrix (M33, ADR 0030; manual runs only)
        # .NET Core 2.0 to .NET 9 and older SDKs in .work/dotnet-compat: slow to install, so only in the matrix run.
        # Without it the Codalus.TargetFrameworks.Tests suite skips; with CODALUS_DOTNET_COMPAT it must pass.
        if: github.event_name == 'workflow_dispatch' && matrix.shard == 'others'
        shell: bash
        run: |
          bash eng/get-runtimes.sh
          echo "CODALUS_DOTNET_COMPAT=${{ github.workspace }}/.work/dotnet-compat" >> "$GITHUB_ENV"
          bash eng/get-netcoredbg.sh --x64
      - name: Restore
        run: dotnet restore Codalus.slnx
      - name: Build
        run: dotnet build Codalus.slnx -c Release --no-restore
      - name: Developer tools access (macOS)
        # Dumps (createdump) and attaching (netcoredbg) need it; otherwise the system asks for a password that nobody
        # answers on a runner, and they time out (as a person would approve once).
        if: runner.os == 'macOS'
        run: |
          sudo DevToolsSecurity -enable
          sudo dseditgroup -o edit -a "$USER" -t user _developer
          sudo security authorizationdb write system.privilege.taskport allow
      - name: Display for the tests (Xvfb)
        # Tests that run real windowed apps (the Live Visual Tree's Avalonia app) need one on Linux.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: Test (${{ matrix.shard }})
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" bash eng/ci-test.sh ${{ matrix.shard }}
          else
            bash eng/ci-test.sh ${{ matrix.shard }}
          fi
      - name: Processes the tests left running
        # What the tests left behind is listed: a leak to fix.
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          # BSD ps (macOS) has no --sort: sort by the CPU column instead.
          ps -eo pid,ppid,etime,pcpu,rss,args | sort -k4 -nr | head -25 | cut -c1-240 || true
          df -h / /tmp | uniq

  # The published Native AOT app, windowed, through every MVP milestone (eng/smoke-test.sh): catches what the in-process
  # headless tests cannot (trimming, the published hosts/ and plugins/ layout, the real windowing platform). On a runner
  # of its own (it needs the machine to itself), alongside the tests.
  smoke:
    needs: matrix
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 70 || 45 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            9.0.x
            11.0.100-rc.1.26425.128
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: .work/netcoredbg
          key: netcoredbg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('eng/get-netcoredbg.sh') }}
      - name: Debugger (netcoredbg, pinned and checksummed)
        shell: bash
        run: eng/get-netcoredbg.sh
      - name: Developer tools access (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo DevToolsSecurity -enable
          sudo dseditgroup -o edit -a "$USER" -t user _developer
          # The windowed app runs in the runner's GUI session, where the task port right still asked (developer mode
          # was already on). Only on this throwaway runner (the maintainer's decision, 2026-10-12).
          sudo security authorizationdb write system.privilege.taskport allow
      - name: Native AOT publish must stay warning-free in our code
        shell: bash
        run: |
          rid=$(dotnet --info | awk '/RID:/ {print $2; exit}')
          dotnet publish src/Codalus.Shell -c Release -r "$rid" -o artifacts/shell
      - name: Display for the smoke test (Xvfb)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: Stack traces for a smoke test failure (dotnet-stack)
        # The smoke test prints the C# host's stacks when a step fails: a host that stopped answering says where it is.
        if: runner.os != 'Windows'
        run: dotnet tool install -g dotnet-stack || true
      - name: End-to-end smoke test of the published app
        shell: bash
        timeout-minutes: 25
        env:
          CODALUS_NETCOREDBG: ${{ github.workspace }}/.work/netcoredbg
        run: bash eng/smoke-test.sh artifacts/shell/codalus artifacts/smoke-test
      - name: Old runtimes in containers of their distributions (M33, ADR 0030; manual runs only)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        shell: bash
        timeout-minutes: 20
        run: bash eng/compat-containers.sh
      # Always: the screenshots are the website's (CLAUDE.md, Website), and a failure's report.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-${{ runner.os }}
          path: artifacts/smoke-test/
          retention-days: 14
          if-no-files-found: ignore
