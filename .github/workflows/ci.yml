name: CI

# Cost policy while the repo is private on the free plan (2,000 minutes a month; Windows bills 2x, macOS 10x):
# pushes run Linux only and skip documentation-only changes; the full Windows/macOS/Linux matrix runs on manual
# dispatch, once per milestone checkpoint. There is no nightly schedule.
# Public-repo configuration (automatic once the repository is public; GitHub-hosted minutes are free there):
# every push and every pull request runs the full matrix.
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.event.repository.private }}" == "true" ]]; then
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          fi

  dotnet:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: .work/netcoredbg
          key: netcoredbg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('eng/get-netcoredbg.sh') }}
      - name: Debugger (netcoredbg, pinned and checksummed)
        shell: bash
        run: eng/get-netcoredbg.sh
      - name: Restore
        run: dotnet restore Daedalus.slnx
      - name: Build
        run: dotnet build Daedalus.slnx -c Release --no-restore
      - name: Test (unit, integration, headless UI)
        run: dotnet test --solution Daedalus.slnx -c Release --no-build
      - name: Native AOT publish must stay warning-free in our code
        shell: bash
        run: |
          rid=$(dotnet --info | awk '/RID:/ {print $2; exit}')
          dotnet publish src/Daedalus.Shell -c Release -r "$rid" -o artifacts/shell
