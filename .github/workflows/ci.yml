name: CI

# Cost policy while the repo is private on the free plan (2,000 minutes a month; Windows bills 2x, macOS 10x):
# pushes run Linux only and skip documentation-only changes; the full Windows/macOS/Linux matrix runs on manual
# dispatch, once per milestone checkpoint. There is no nightly schedule.
# Public-repo configuration (automatic once the repository is public; GitHub-hosted minutes are free there):
# every push and every pull request runs the full matrix.
on:
  push:
    branches: [develop, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [develop, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.event.repository.private }}" == "true" ]]; then
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          fi

  dotnet:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.os) }}
    runs-on: ${{ matrix.os }}
    # The manual matrix run also installs and runs the target framework matrix (M33).
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 120 || 90 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          # samples/Testing has a multi-targeted test project (net9.0;net10.0). samples/Net11 needs the .NET 11 SDK
          # (M30): keep it in step with samples/Net11/global.json (docs/release/dotnet-upgrade.md).
          dotnet-version: |
            9.0.x
            11.0.100-rc.1.26425.128
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: .work/netcoredbg
          key: netcoredbg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('eng/get-netcoredbg.sh') }}
      - name: Debugger (netcoredbg, pinned and checksummed)
        shell: bash
        run: eng/get-netcoredbg.sh
      - name: Target framework matrix (M33, ADR 0030; manual runs only)
        # .NET Core 2.0 to .NET 9 and older SDKs in .work/dotnet-compat: slow to install, so only in the matrix run.
        # Without it the DaedalusStudio.TargetFrameworks.Tests suite skips; with DAEDALUS_DOTNET_COMPAT it must pass.
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          bash eng/get-runtimes.sh
          echo "DAEDALUS_DOTNET_COMPAT=${{ github.workspace }}/.work/dotnet-compat" >> "$GITHUB_ENV"
          bash eng/get-netcoredbg.sh --x64
      - name: Restore
        run: dotnet restore DaedalusStudio.slnx
      - name: Build
        run: dotnet build DaedalusStudio.slnx -c Release --no-restore
      - name: Developer tools access (macOS)
        # Dumps (createdump) and attaching (netcoredbg) need it, in the tests and the smoke test; otherwise the system asks
        # for a password that nobody answers on a runner, and they time out (as a person would approve once).
        if: runner.os == 'macOS'
        run: |
          sudo DevToolsSecurity -enable
          sudo dseditgroup -o edit -a "$USER" -t user _developer
          # The windowed app runs in the runner's GUI session, where the task port right still asked (developer mode
          # was already on). Only on this throwaway runner (the maintainer's decision, 2026-10-12).
          sudo security authorizationdb write system.privilege.taskport allow
      - name: Test (unit, integration, headless UI)
        # A test process still running after 25 minutes (Shell.Tests normally takes 13) is dumped, and the tests that
        # were running are named, instead of the job timing out without a word. The Windows runner has four cores: all
        # the test projects at once (builds, debuggers, Aspire's orchestrator) timed out at random there, so it runs three
        # at a time (and the job may take 90 minutes).
        run: dotnet test --solution DaedalusStudio.slnx -c Release --no-build --hangdump --hangdump-timeout 25m --hangdump-type Mini ${{ runner.os == 'Windows' && '--max-parallel-test-modules 3' || '' }}
      - name: Processes the tests left running
        # The smoke test needs the machine to itself: what the tests left behind is listed (a leak to fix), then ended.
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          # BSD ps (macOS) has no --sort: sort by the CPU column instead.
          ps -eo pid,ppid,etime,pcpu,rss,args | sort -k4 -nr | head -25 | cut -c1-240 || true
          df -h / /tmp | uniq
          dotnet build-server shutdown > /dev/null 2>&1 || true
          pkill -f 'chrome|chromium|msedge|dapDebugServer|blazor-devserver|BrowserDebugHost|dotnet-watch' || true
      - name: Native AOT publish must stay warning-free in our code
        shell: bash
        run: |
          rid=$(dotnet --info | awk '/RID:/ {print $2; exit}')
          dotnet publish src/DaedalusStudio.Shell -c Release -r "$rid" -o artifacts/shell
      - name: Display for the smoke test (Xvfb)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: Stack traces for a smoke test failure (dotnet-stack)
        # The smoke test prints the C# host's stacks when a step fails: a host that stopped answering says where it is.
        if: runner.os != 'Windows'
        run: dotnet tool install -g dotnet-stack || true
      # The published Native AOT app, windowed, through every MVP milestone (eng/smoke-test.sh): catches what the
      # in-process headless tests cannot (trimming, the published hosts/ and plugins/ layout, the real windowing platform).
      - name: End-to-end smoke test of the published app
        shell: bash
        timeout-minutes: 25
        env:
          DAEDALUS_NETCOREDBG: ${{ github.workspace }}/.work/netcoredbg
        run: bash eng/smoke-test.sh artifacts/shell/daedalus artifacts/smoke-test
      - name: Old runtimes in containers of their distributions (M33, ADR 0030; manual runs only)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        shell: bash
        timeout-minutes: 20
        run: bash eng/compat-containers.sh
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: smoke-test-${{ runner.os }}
          path: artifacts/smoke-test/
          if-no-files-found: ignore
