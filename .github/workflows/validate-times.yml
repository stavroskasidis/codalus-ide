name: Validate Shell shard times

# Temporary (the validate-times branch only): the Shell shards on Linux and Windows, every test's time in the log.
on:
  push:
    branches: [validate-times]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [shell-1, shell-2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          extra-sdks: true
          nuget-cache: true
          netcoredbg: true
          devtools: true
          display: true
      - run: dotnet restore Codalus.slnx
      - run: dotnet build Codalus.slnx -c Release --no-restore
      - run: dotnet tool install -g dotnet-stack || true
      - name: Test (${{ matrix.shard }})
        shell: bash
        timeout-minutes: 40
        run: bash eng/ci-test.sh ${{ matrix.shard }}
