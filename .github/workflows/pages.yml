name: GitHub Pages

# Everything GitHub Pages serves, rebuilt as one site: the website and the package repositories. First the apt and dnf
# repositories from the newest stable release and
# the newest nightly (eng/linux-repos.sh, signed with the PACKAGES_GPG_PRIVATE_KEY secret): only their metadata, since
# the packages are downloaded from their releases (2026-10-18: with the packages the site outgrew Pages' 1 GB limit).
# They are checked by installing from them with apt, dnf and zypper, signatures verified (eng/test-linux-repos.sh), from
# a copy built with file: addresses, since a release in the making has no assets yet (M31, D18); then the website, the Blazor
# app in website/ exported to static files with those releases' download links. Only master deploys (the maintainer's
# rule, 2026-10-13): each stable release does (pipeline.yml), and so does a push to master that changes only
# documentation, which the pipeline ignores (docs/**, **/*.md). A push to master that changes anything else starts the
# pipeline too, so this run leaves the site to it (scope): the release deploys the site only once every gate passed, and
# a failed release deploys nothing (atomic releases). A website change reaches master only in a release.
# Nightlies don't deploy, so the nightly channel and the site's nightly links move on with master.
# Started on another branch (workflow_dispatch), it builds and checks the site without deploying it.
# A stable release (pipeline.yml) calls it before publishing anything, with the release's own packages from its run and
# deploy: false: the repositories are built and installed from, and the site exported, as a gate. The pipeline deploys
# the Pages artifact this uploads only once every gate passed and the release is published (atomic releases).
on:
  workflow_call:
    inputs:
      release:
        description: The stable release being made (v1.2.3), whose packages are this run's packages-* artifacts
        type: string
        default: ""
      deploy:
        description: Deploy the site (false when a release deploys it itself after publishing)
        type: boolean
        default: true
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "docs/user-guide/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # On its own push trigger: whether the push also starts pipeline.yml, which then deploys the site with its release.
  # (Called from pipeline.yml, github.event_name is the pipeline's, so the workflow's own name tells the two apart.)
  scope:
    if: github.event_name == 'push' && contains(github.workflow_ref, '/.github/workflows/pages.yml@')
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.changes.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # The pipeline's paths-ignore (docs/** and **/*.md): a push of only those starts no pipeline run.
          if ! git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          others="$(git diff --name-only "$BEFORE" "$AFTER" | grep -vE '^docs/|\.md$' || true)"
          if [ -n "$others" ]; then
            echo "::notice::This push also changes $(wc -l <<< "$others") other files, so pipeline.yml runs and its release deploys the site."
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: scope
    # scope is skipped when called by the pipeline or dispatched; then this always runs.
    if: ${{ !cancelled() && (needs.scope.result == 'skipped' || needs.scope.outputs.docs-only == 'true') }}
    runs-on: ubuntu-latest
    steps:
      # The whole history: the sitemap dates each page by its source's last commit (website/Site/PageDates.cs).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c rpm
      - name: The release's own packages (from this run)
        if: inputs.release != ''
        uses: actions/download-artifact@v8
        with:
          pattern: packages-linux-*
          path: downloaded
      - name: The newest stable and nightly packages
        id: releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          # The newest published release of a kind that has codalus packages (releases from before the rename to
          # Codalus IDE have daedalus-studio ones, which the repositories don't serve).
          newest() {
            gh release list --limit 200 --json tagName -q '.[].tagName' | grep -E -- "$1" | sort -rV | while read -r tag; do
              if gh release view "$tag" --json assets -q '.assets[].name' | grep -qE '^codalus.*\.deb$'; then echo "$tag"; break; fi
            done
          }
          # Each release's packages in packages/<tag>/, under their asset names.
          if [ -n "$RELEASE" ]; then
            # A release in the making: its packages are this run's artifacts, not published yet.
            stable="$RELEASE"
            mkdir -p "packages/$stable"
            find downloaded \( -name '*.deb' -o -name '*.rpm' \) -exec cp {} "packages/$stable/" \;
          else
            stable="$(newest '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
            [ -n "$stable" ] && gh release download "$stable" -D "packages/$stable" -p '*.deb' -p '*.rpm'
          fi
          nightly="$(newest '-nightly\.' || true)"
          [ -n "$nightly" ] && gh release download "$nightly" -D "packages/$nightly" -p '*.deb' -p '*.rpm'
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"
          mkdir -p packages && ls -R packages
      # The site's address as Pages serves it (a custom domain of the owner's, or <owner>.github.io), over HTTPS: apt
      # refuses a redirect from HTTPS to HTTP, which github.io gives when the owner has a custom domain.
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build the signed repositories
        shell: bash
        env:
          PACKAGES_GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
          STABLE: ${{ steps.releases.outputs.stable }}
          NIGHTLY: ${{ steps.releases.outputs.nightly }}
        run: |
          base="${{ steps.pages.outputs.base_url }}"
          args=(--packages packages)
          [ -n "$STABLE" ] && args+=(--stable "$STABLE")
          [ -n "$NIGHTLY" ] && args+=(--nightly "$NIGHTLY")
          bash eng/linux-repos.sh --out site --base-url "https://${base#*://}" \
            --packages-url "${{ github.server_url }}/${{ github.repository }}/releases/download" "${args[@]}"
          # The same repositories with file: addresses, which eng/test-linux-repos.sh mounts.
          bash eng/linux-repos.sh --out test-site --base-url file:///site --packages-url file:///packages "${args[@]}"
      - name: Install from them (apt and dnf, signatures checked)
        shell: bash
        run: |
          if [ -d test-site/rpm/stable ]; then bash eng/test-linux-repos.sh test-site packages stable; fi
          if [ -d test-site/rpm/nightly ]; then bash eng/test-linux-repos.sh test-site packages nightly; fi
      - uses: ./.github/actions/setup
      # The app renders every page into the same folder (it leaves the repositories alone) and fails on a broken link
      # or anchor. A relative --export path is taken from the repository root.
      - name: Export the website
        shell: bash
        run: |
          base="${{ steps.pages.outputs.base_url }}"
          dotnet run --project website -c Release --no-launch-profile -- --export site --base-url "https://${base#*://}/" \
            --ref "${{ github.ref_name }}" --stable "${{ steps.releases.outputs.stable }}" --nightly "${{ steps.releases.outputs.nightly }}"
      # Lighthouse 95+ on every page (M50): performance, accessibility, best practices and SEO, on its mobile defaults.
      # A second export, served from a local port at its root, so the pages' links and assets resolve there.
      - name: Lighthouse
        shell: bash
        run: |
          dotnet run --project website -c Release --no-launch-profile --no-build -- --export "$RUNNER_TEMP/lighthouse-site" \
            --base-url "http://127.0.0.1:8765/" --ref "${{ github.ref_name }}" --stable "${{ steps.releases.outputs.stable }}" --nightly "${{ steps.releases.outputs.nightly }}"
          bash eng/lighthouse.sh "$RUNNER_TEMP/lighthouse-site"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    # inputs.deploy is null on a push or dispatch, and expressions compare null equal to false, so compare as text.
    # build skipped (the pipeline deploys) skips this too.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/master' && format('{0}', inputs.deploy) != 'false' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.address.outputs.url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # Pages reports http:// for a project site under its owner's custom domain, though the site is served over HTTPS.
      - id: address
        shell: bash
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "url=https://${url#*://}" >> "$GITHUB_OUTPUT"
