name: Website and Linux repositories

# Everything GitHub Pages serves, rebuilt as one site: the apt and dnf repositories from the newest stable release and
# the newest nightly (eng/linux-repos.sh, signed with the PACKAGES_GPG_PRIVATE_KEY secret), checked by installing from
# them with apt, dnf and zypper, signatures verified (eng/test-linux-repos.sh) (M31, D18); then the website, the Blazor
# app in website/ exported to static files with those releases' download links. Only master deploys (the maintainer's
# rule, 2026-10-13): release.yml calls this after each release, and a push to master that changes the website or the
# user guide runs it; nightlies don't deploy, so the nightly channel and the site's nightly links move on with master.
# Started on another branch (workflow_dispatch), it builds and checks the site without deploying it.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "docs/user-guide/**"
      - ".github/workflows/linux-repos.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c rpm
      - name: The newest stable and nightly packages
        id: releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stable="$(gh release list --limit 200 --json tagName -q '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -rV | head -n 1 || true)"
          nightly="$(gh release list --limit 200 --json tagName -q '.[].tagName' | grep -E -- '-nightly\.' | sort -rV | head -n 1 || true)"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"
          [ -n "$stable" ] && gh release download "$stable" -D packages/stable -p '*.deb' -p '*.rpm'
          [ -n "$nightly" ] && gh release download "$nightly" -D packages/nightly -p '*.deb' -p '*.rpm'
          mkdir -p packages && ls -R packages
      # The site's address as Pages serves it (a custom domain of the owner's, or <owner>.github.io), over HTTPS: apt
      # refuses a redirect from HTTPS to HTTP, which github.io gives when the owner has a custom domain.
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the signed repositories
        shell: bash
        env:
          PACKAGES_GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
        run: |
          base="${{ steps.pages.outputs.base_url }}"
          args=(--out site --base-url "https://${base#*://}")
          [ -d packages/stable ] && args+=(--stable packages/stable)
          [ -d packages/nightly ] && args+=(--nightly packages/nightly)
          bash eng/linux-repos.sh "${args[@]}"
      - name: Install from them (apt and dnf, signatures checked)
        shell: bash
        run: |
          [ -d site/rpm/stable ] && bash eng/test-linux-repos.sh site stable
          [ -d site/rpm/nightly ] && bash eng/test-linux-repos.sh site nightly
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The app renders every page into the same folder (it leaves the repositories alone) and fails on a broken link
      # or anchor. A relative --export path is taken from the repository root.
      - name: Export the website
        shell: bash
        run: |
          base="${{ steps.pages.outputs.base_url }}"
          dotnet run --project website -c Release --no-launch-profile -- --export site --base-url "https://${base#*://}/" \
            --ref "${{ github.ref_name }}" --stable "${{ steps.releases.outputs.stable }}" --nightly "${{ steps.releases.outputs.nightly }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.address.outputs.url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Pages reports http:// for a project site under its owner's custom domain, though the site is served over HTTPS.
      - id: address
        shell: bash
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "url=https://${url#*://}" >> "$GITHUB_OUTPUT"
