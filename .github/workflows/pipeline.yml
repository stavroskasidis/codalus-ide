name: Pipeline

# The one pipeline for develop, master and pull requests (M31, ADR 0028, D20/D21). Every run builds, tests and
# smoke-tests on Windows, macOS and Linux (CI), and a branch's run releases what passed:
# - develop: a nightly, v<VERSION>-nightly.<date>.<run>, published as a GitHub prerelease with the commits since the
#   previous nightly as its notes. The newest 14 are kept.
# - master: a stable release, v<VERSION> (every merge of a release/X.Y.Z branch, and every hotfix; the run fails if that
#   tag exists already), the latest release, with notes from the commits since the previous stable release. Afterwards the
#   site with the apt and dnf repositories is deployed, the AUR package and the plugin SDK's NuGet packages pushed, and
#   develop takes in master (a release branch's fixes, a hotfix) and moves past the released version.
# - pull requests and other branches: CI only.
# A release is atomic (the maintainer's rule, 2026-10-14): every gate runs first on the release's own commit: CI (test,
# smoke), the packages installed and smoke-tested on every platform (packages), and for a stable release also the
# benchmarks and the apt, dnf and zypper repositories built and installed from with the site exported (site,
# pages.yml with deploy: false). Only when all of them pass is anything published; otherwise the tag goes.
# A run stops at its first failed job, which cancels the rest (ADR 0028, 2026-10-20). A release/X.Y.Z → master pull request
# skips test and smoke when develop's own run passed on its head (gate). A release is cut from develop as release/X.Y.Z and
# merged into master by pull request, so develop stays open meanwhile (ADR 0028, 2026-10-21; docs/release/releasing.md).
# A pull request passes when its one ci job does, the check the branch ruleset requires (ADR 0028, 2026-10-26); a docs-only
# pull request skips test and smoke (gate).
# Manual dispatch runs the branch's pipeline as a dry run by default (everything built and tested, nothing published).
# The target framework matrix (M33) is compat.yml, by hand.
on:
  push:
    branches: [develop, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Every pull request runs, a docs-only one too: the branch ruleset requires its ci check, which a run that never started
  # would leave waiting forever. A docs-only pull request skips test and smoke instead (gate).
  pull_request:
    # A fix a release needs goes into its release/X.Y.Z branch by pull request, and is tested like any other.
    branches: [develop, master, "release/**"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test without publishing
        type: boolean
        default: true
      benchmarks:
        description: Also run the benchmarks (a stable release always does)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  # A newer push to develop (or a pull request) replaces the run in progress, and an unpublished nightly's tag goes with
  # it (untag); a stable release always runs to the end.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  # What this run releases: a nightly from develop, a stable release from master, nothing from anywhere else.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release's tag
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - id: kind
        shell: bash
        run: |
          kind=""
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            case "$GITHUB_REF" in
              refs/heads/master) kind=stable ;;
              refs/heads/develop) kind=nightly ;;
            esac
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
      - if: steps.kind.outputs.kind != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: steps.kind.outputs.kind != ''
        uses: ./.github/actions/setup
      - id: plan
        if: steps.kind.outputs.kind != ''
        shell: bash
        env:
          KIND: ${{ steps.kind.outputs.kind }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$KIND" == "stable" ]]; then
            version="$(dotnet run --project eng/Codalus.Release -- version stable)"
            dotnet run --project eng/Codalus.Release -- check-tag "$version"
            previous="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          else
            version="$(dotnet run --project eng/Codalus.Release -- version nightly --run "$GITHUB_RUN_NUMBER")"
            previous="$(git tag --list 'v*-nightly.*' --sort=-v:refname | head -n 1)"
          fi
          publish=true
          [[ "$DRY_RUN" == "true" ]] && publish=false
          {
            echo "version=$version"
            echo "previous=$previous"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Release ($KIND) $version from ${GITHUB_SHA::7} (previous: ${previous:-none}; publish: $publish)" >> "$GITHUB_STEP_SUMMARY"
      # The tag comes first, while the commit is still the branch's head: the workflow token may create a tag only on
      # a commit whose workflow files match the default branch's (otherwise it needs the workflows permission, which
      # it can't have), and the branch may move on with workflow changes during the build. untag removes it again.
      - name: Tag the commit
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v${{ steps.plan.outputs.version }}" -f sha="$GITHUB_SHA" > /dev/null

  # A pull request that changes only docs/** and *.md files skips test and smoke: pushes of those start no run at all
  # (paths-ignore), but a pull request runs so that it reports ci.
  # A release/X.Y.Z → master pull request (a release) whose head already passed develop's own run, on a commit that has
  # all of master, skips test and smoke: the release run on master runs them again before anything is published (the
  # maintainer's decision, 2026-10-20: the same tree tested twice held up every release by about 50 minutes). A release
  # branch cut from a develop commit whose run passed qualifies; once a fix is merged into it, its head is new and is tested.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.docs.outputs.skip || steps.check.outputs.skip }}
    steps:
      - id: docs
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A listing that fails tests everything.
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')" || exit 0
          if [[ -n "$files" ]] && ! grep -qvE '^docs/|\.md$' <<< "$files"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Only docs/** and *.md files change: test and smoke are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      # A release branch's VERSION is the X.Y.Z of its name (it is what master publishes), and its workflow files are
      # develop's: the release's tag is created by the workflow token, which GitHub lets tag only a commit whose workflow
      # files match the default branch's (M31b), so a workflow change goes into both (docs/release/releasing.md).
      - name: The release branch's version and workflows
        if: github.event_name == 'pull_request' && github.base_ref == 'master' && startsWith(github.head_ref, 'release/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          version="$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$HEAD_SHA" --jq .content | base64 -d | tr -d '[:space:]')"
          if [[ "$version" != "${HEAD_REF#release/}" ]]; then
            echo "::error::$HEAD_REF has VERSION $version: a release branch's VERSION is the version in its name." && exit 1
          fi
          workflows() { gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows?ref=$1" --jq '[.[] | {name, sha}] | sort_by(.name)'; }
          if [[ "$(workflows "$HEAD_SHA")" != "$(workflows develop)" ]]; then
            echo "::error::$HEAD_REF's .github/workflows differ from develop's, and the release couldn't be tagged: bring the workflow changes into both by pull request (docs/release/releasing.md)." && exit 1
          fi
      - id: check
        if: github.event_name == 'pull_request' && github.base_ref == 'master' && startsWith(github.head_ref, 'release/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          passed="$(gh run list -R "$GITHUB_REPOSITORY" --workflow pipeline.yml --branch develop --event push --commit "$HEAD_SHA" --status success --json databaseId --jq length)"
          behind="$(gh api "repos/$GITHUB_REPOSITORY/compare/master...$HEAD_SHA" --jq .behind_by)"
          if [[ "$passed" -gt 0 && "$behind" == 0 ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Develop's run passed on ${HEAD_SHA::7}, which has all of master: test and smoke run again in the release run on master, not here." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The tests in three shards per OS on separate runners at the same time (eng/ci-test.sh): the Shell tests in two
  # halves (they take 15 to 25 minutes on their own) and every other project. With the smoke test on a runner of its
  # own, a run takes as long as its longest job, not the sum of them (it took 55 minutes on Windows). A fourth,
  # debug-codalus, runs the debugger classes under Codalus IDE's own CoreCLR adapter (M54, ADR 0086), on Linux arm64
  # too, where it is the only shard (the M54 plan: the other shards' coverage there is the packages' smoke test).
  test:
    name: test (${{ matrix.os }}, ${{ matrix.shard }})
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    permissions:
      contents: read
      actions: write # stopping the run at its first failure
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        shard: [shell-1, shell-2, others, debug-codalus]
        include:
          - { os: ubuntu-24.04-arm, shard: debug-codalus }
    runs-on: ${{ matrix.os }}
    # macOS runners are the slowest and vary most: a Shell shard that takes 16 to 24 minutes on one ran past 40 on a slow
    # one (0.6.0's release run; develop's run 40241261003, M50), so macOS gets 20 minutes more.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 70 || 50 }}
    steps:
      - uses: actions/checkout@v7
      # The display is for tests that run real windowed apps (the Live Visual Tree's Avalonia app).
      - id: setup
        uses: ./.github/actions/setup
        with:
          extra-sdks: true
          nuget-cache: true
          netcoredbg: true
          devtools: true
          display: true
          downloads: true
          browser: true
      - run: dotnet restore Codalus.slnx
      - run: dotnet build Codalus.slnx -c Release --no-restore
      - name: Save the NuGet cache (develop, one job per OS)
        # The others shard restores every project, as the rest do. Pull requests only restore what develop saved.
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && matrix.shard == 'others' && steps.setup.outputs.nuget-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.nuget/packages
          key: ${{ steps.setup.outputs.nuget-cache-key }}
      - name: Stack traces for a hang (dotnet-stack)
        # The test watchdog prints a hanging test's stacks with it (tests/Shared/TestWatchdog.cs, eng/ci-test.sh).
        run: dotnet tool install -g dotnet-stack || true
      - name: Test (${{ matrix.shard }})
        shell: bash
        # A hang is reported and ended by 15 minutes (eng/ci-test.sh): this is the last resort, leaving the job time for
        # the steps below. macOS shell-2 (15 minutes in run 40663222511) stops at 40: its runner was lost 45 to 46 minutes
        # into this step three times, and a lost runner keeps neither its log nor its artifacts (runs 40255384457,
        # 40453091722 and 40675641432, docs/ci-flakes.md), so the next hang fails here with both.
        timeout-minutes: ${{ matrix.os == 'macos-latest' && (matrix.shard == 'shell-2' && 40 || 60) || 40 }}
        run: bash eng/ci-test.sh ${{ matrix.shard }}
      - name: Anything downloaded (Node.js, vscode-js-debug)
        id: downloaded
        if: always() && steps.setup.outputs.downloads-hit != 'true'
        shell: bash
        run: if [ -n "$(ls -A "$CODALUS_DOWNLOAD_CACHE" 2> /dev/null)" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save the downloads
        # After the steps that download them, passed or not: the next runs take them from the cache (the setup's
        # downloads input). Several jobs may save the same key: the first one does, the others say it exists.
        if: always() && steps.downloaded.outputs.any == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/codalus-downloads
          key: ${{ steps.setup.outputs.downloads-key }}
      - name: Processes the tests left running
        # What the tests left behind is listed: a leak to fix.
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          # BSD ps (macOS) has no --sort: sort by the CPU column instead.
          ps -eo pid,ppid,etime,pcpu,rss,args | sort -k4 -nr | head -25 | cut -c1-240 || true
          df -h / /tmp | uniq
      - name: Stacks in the hang dumps
        # HangDump's dumps, read here (on the OS that wrote them) in case the watchdog's dotnet-stack got nothing.
        if: (failure() || cancelled()) && hashFiles('artifacts/test-results/**/*.dmp') != ''
        shell: bash
        timeout-minutes: 8
        run: |
          dotnet tool install -g dotnet-dump || true
          find artifacts/test-results -name '*.dmp' | while IFS= read -r dump; do
            echo "::group::Managed stacks in $dump"
            "$HOME/.dotnet/tools/dotnet-dump" analyze "$dump" -c "clrstack -all" -c exit > "$dump.stacks.txt" 2>&1 || true
            cat "$dump.stacks.txt"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.shard }}
          path: artifacts/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Stop the run at its first failure
        # The run fails either way: its other jobs stop and free their runners (macOS ones are scarce), and a release's
        # tag still goes (untag runs in a cancelled run too). This job may then show as cancelled: the error names it.
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::error::test (${{ matrix.os }}, ${{ matrix.shard }}) failed: the run's other jobs are cancelled."
          gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" || true

  # The published Native AOT app, windowed, through every MVP milestone (eng/smoke-test.sh): catches what the in-process
  # headless tests cannot (trimming, the published hosts/ and plugins/ layout, the real windowing platform). On a runner
  # of its own (it needs the machine to itself), alongside the tests.
  smoke:
    name: smoke (${{ matrix.os }})
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    permissions:
      contents: read
      actions: write # stopping the run at its first failure
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The publish takes 10 to 31 minutes on a macOS runner and the smoke test up to its own 40: at 60, a slow runner ran out
    # of time in the middle of a passing smoke test (#111, run 39668401109).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
        with:
          extra-sdks: true
          nuget-cache: true
          netcoredbg: true
          devtools: true
          display: true
          downloads: true
      - name: Native AOT publish must stay warning-free in our code
        shell: bash
        run: |
          rid=$(dotnet --info | awk '/RID:/ {print $2; exit}')
          dotnet publish src/Codalus.Shell -c Release -r "$rid" -o artifacts/shell
      - name: Stack traces for a smoke test failure (dotnet-stack)
        # The smoke test prints the C# host's stacks when a step fails: a host that stopped answering says where it is.
        if: runner.os != 'Windows'
        run: dotnet tool install -g dotnet-stack || true
      - name: End-to-end smoke test of the published app
        shell: bash
        # The command sweep (shell.commandSweep) takes up to 25 of these.
        timeout-minutes: 40
        env:
          CODALUS_NETCOREDBG: ${{ github.workspace }}/.work/netcoredbg
        run: bash eng/smoke-test.sh artifacts/shell/codalus artifacts/smoke-test
      - name: Anything downloaded (Node.js, vscode-js-debug)
        id: downloaded
        if: always() && steps.setup.outputs.downloads-hit != 'true'
        shell: bash
        run: if [ -n "$(ls -A "$CODALUS_DOWNLOAD_CACHE" 2> /dev/null)" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save the downloads
        # After the steps that download them, passed or not: the next runs take them from the cache (the setup's
        # downloads input). Several jobs may save the same key: the first one does, the others say it exists.
        if: always() && steps.downloaded.outputs.any == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/codalus-downloads
          key: ${{ steps.setup.outputs.downloads-key }}
      # Always: the screenshots are the website's (CLAUDE.md, Website), and a failure's report.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test-${{ runner.os }}
          path: artifacts/smoke-test/
          retention-days: 14
          if-no-files-found: ignore
      - name: Stop the run at its first failure
        # The run fails either way: its other jobs stop and free their runners (macOS ones are scarce), and a release's
        # tag still goes (untag runs in a cancelled run too). This job may then show as cancelled: the error names it.
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::error::smoke (${{ matrix.os }}) failed: the run's other jobs are cancelled."
          gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" || true

  # The one check a pull request needs (the "protect" ruleset requires it on develop and master): the gate and every test
  # and smoke job passed, or the gate skipped them (a docs-only pull request, a release whose head passed develop's run).
  # It runs in a cancelled run too, and fails there: a run stops at its first failure by cancelling itself.
  ci:
    needs: [gate, test, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          RESULTS: ${{ needs.gate.result }} ${{ needs.test.result }} ${{ needs.smoke.result }}
        run: |
          echo "gate, test, smoke: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "::error::CI didn't pass (gate, test, smoke: $RESULTS)." && exit 1
            fi
          done

  # The installers on every platform (eng/package.sh), installed the way users would and the installed app
  # smoke-tested (eng/smoke-test.sh --packages), then uploaded for publish.
  packages:
    needs: plan
    if: needs.plan.outputs.kind != ''
    permissions:
      contents: read
      actions: write # stopping the run at its first failure
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    # The version and kind go into each command, never the job's environment: MSBuild reads environment variables as
    # properties, so a VERSION there would stamp every project the smoke test builds (Plain.1.0.0.nupkg wasn't).
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release notes read the history and the tags
      # The smoke test has a .NET 11 step (M30); dumps and attaching need the developer tools (debug.companion,
      # debug.roslyn, debug.remote); browser debugging (blazor.wasmDebug, blazor.compoundDebug) a browser on Linux arm64.
      - id: setup
        uses: ./.github/actions/setup
        with:
          extra-sdks: true
          devtools: true
          downloads: true
          browser: true
      - name: Linux prerequisites (Native AOT, AppImage, rpm, delta packages, Xvfb)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev squashfs-tools rpm zstd xvfb
      - name: macOS prerequisites (delta packages)
        if: runner.os == 'macOS'
        run: command -v zstd || brew install zstd
      - name: The previous release of this channel (Velopack delta packages)
        if: needs.plan.outputs.previous != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          channel="${{ matrix.rid }}-${{ needs.plan.outputs.kind }}"
          gh release download "${{ needs.plan.outputs.previous }}" -D previous-release -p "releases.$channel.json" -p "*-$channel-full.nupkg" \
            || echo "No $channel files in ${{ needs.plan.outputs.previous }}: no delta package this time."
      - name: Release notes
        shell: bash
        run: dotnet run --project eng/Codalus.Release -- notes "${{ needs.plan.outputs.kind }}" "${{ needs.plan.outputs.version }}" --repo "$GITHUB_REPOSITORY" > release-notes.md
      - name: Package
        shell: bash
        env:
          CODALUS_PREVIOUS_RELEASE: ${{ github.workspace }}/previous-release
          CODALUS_RELEASE_NOTES: ${{ github.workspace }}/release-notes.md
          # The update feed's signature (M32): installed builds refuse a feed without it.
          CODALUS_FEED_KEY: ${{ secrets.FEED_SIGNING_KEY }}
          # Code signing (D19) waits behind this secret.
          CODALUS_CODESIGN_IDENTITY: ${{ secrets.CODALUS_CODESIGN_IDENTITY }}
          # The .rpm's signature: the dnf repository serves the release's own file with gpgcheck on (eng/linux-repos.sh).
          CODALUS_PACKAGES_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then export PATH="$PATH:/c/Program Files (x86)/Microsoft Visual Studio/Installer"; fi
          bash eng/package.sh "${{ needs.plan.outputs.version }}" "${{ needs.plan.outputs.kind }}"
      - name: Stack traces for a smoke test failure (dotnet-stack)
        if: runner.os != 'Windows'
        run: dotnet tool install -g dotnet-stack || true
      - name: Install, smoke-test and uninstall the packages
        shell: bash
        timeout-minutes: 40
        run: bash eng/smoke-test.sh --packages artifacts/packages artifacts/smoke-test
      - name: Anything downloaded (Node.js, vscode-js-debug)
        id: downloaded
        if: always() && steps.setup.outputs.downloads-hit != 'true'
        shell: bash
        run: if [ -n "$(ls -A "$CODALUS_DOWNLOAD_CACHE" 2> /dev/null)" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save the downloads
        # After the steps that download them, passed or not: the next runs take them from the cache (the setup's
        # downloads input). Several jobs may save the same key: the first one does, the others say it exists.
        if: always() && steps.downloaded.outputs.any == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/codalus-downloads
          key: ${{ steps.setup.outputs.downloads-key }}
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: smoke-test-${{ matrix.rid }}
          path: artifacts/smoke-test/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.rid }}
          path: artifacts/packages/
          if-no-files-found: error
      - name: Stop the run at its first failure
        # The run fails either way: its other jobs stop and free their runners (macOS ones are scarce), and a release's
        # tag still goes (untag runs in a cancelled run too). This job may then show as cancelled: the error names it.
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::error::packages (${{ matrix.rid }}) failed: the run's other jobs are cancelled."
          gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" || true

  # Self-update end to end (M32): version N and N+1 of the installer, N installed, a tampered feed refused, then N
  # updated to N+1 through a signed local feed. It builds its own test installers (eng/test-update.sh), so it runs
  # beside the packages instead of after them: the packages job was the release's longest, with it at its end.
  update:
    needs: plan
    if: needs.plan.outputs.kind != ''
    permissions:
      contents: read
      actions: write # stopping the run at its first failure
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Linux prerequisites (Native AOT, AppImage, rpm, delta packages)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev squashfs-tools rpm zstd
      - name: macOS prerequisites (delta packages)
        if: runner.os == 'macOS'
        run: command -v zstd || brew install zstd
      - name: Self-update test
        shell: bash
        timeout-minutes: 45
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then export PATH="$PATH:/c/Program Files (x86)/Microsoft Visual Studio/Installer"; fi
          bash eng/test-update.sh "$RUNNER_TEMP/update-test"
      - name: Stop the run at its first failure
        # The run fails either way: its other jobs stop and free their runners (macOS ones are scarce), and a release's
        # tag still goes (untag runs in a cancelled run too). This job may then show as cancelled: the error names it.
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::error::update (${{ matrix.rid }}) failed: the run's other jobs are cancelled."
          gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" || true

  # The benchmarks on GitHub-hosted runners, a gate of every stable release (and on a dispatch that asks). These are
  # GPU-less VMs, so the numbers are indicative only; authoritative numbers come from reference hardware
  # (docs/adr/0002-performance-budgets.md). On master the regression gate (`compare`) fails when a scenario regresses
  # against the median of earlier runs on the same runner OS: sizes against one run or a value accepted in
  # benchmarks/accepted.json, latency and memory only against 3 runs on the same runner CPU (fewer: a warning).
  benchmarks:
    needs: plan
    if: needs.plan.outputs.kind == 'stable' || inputs.benchmarks
    permissions:
      contents: read
      actions: write # earlier runs' results (the regression baseline), and stopping the run at its first failure
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          display: true
      - name: Linux dependencies (Native AOT toolchain, VS Code)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev libfontconfig1
          curl -fsSL -o /tmp/code.deb "https://update.code.visualstudio.com/latest/linux-deb-x64/stable"
          sudo apt-get install -y /tmp/code.deb
      - name: macOS VS Code
        if: runner.os == 'macOS'
        run: brew install --cask visual-studio-code
      - name: Windows VS Code
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vscode -y --no-progress
          "CODALUS_BENCH_VSCODE=C:\Program Files\Microsoft VS Code\Code.exe" >> $env:GITHUB_ENV
      - name: Generate fixtures
        run: dotnet run --project benchmarks/Codalus.Benchmarks.FixtureGen -c Release -- all samples
      - name: Publish the shell (with its hosts and built-in plugins)
        shell: bash
        run: |
          rid=$(dotnet --info | awk '/RID:/ {print $2; exit}')
          dotnet publish src/Codalus.Shell -c Release -r "$rid" -o artifacts/shell
      - name: Run benchmarks
        # Bounded below the job's limit: a slow run still reports what it measured, and its log is kept. Cold start takes
        # 6 launches (its p50 of 5 warm ones; with 3 it was the lower of 2), a few seconds each; the heavier scenarios 3
        # (ADR 0002, amendment 2026-10-27).
        timeout-minutes: 70
        shell: bash
        run: |
          bench() { dotnet run --project benchmarks/Codalus.Benchmarks.Harness -c Release -- run --results ci-results --targets shell,vscode "$@"; }
          status=0
          bench --scenarios cold-start --runs 6 || status=$?
          bench --scenarios editor-100k,self-driven,binary-size --runs 3 || status=$?
          exit "$status"
      - name: Report
        if: always()
        run: dotnet run --project benchmarks/Codalus.Benchmarks.Harness -c Release -- report --results ci-results --out ci-results/summary-${{ runner.os }}.md
      - name: Download the baseline (the last 10 runs on master whose benchmarks passed on this OS)
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BENCH_RUNNER: ${{ matrix.os }}
        run: |
          mkdir -p baseline
          # Earlier results: this pipeline's runs, and those of the workflows it replaced (benchmarks.yml, release.yml).
          # A run counts when its benchmarks job for this OS passed, whatever its other jobs did (ADR 0002, amendment
          # 2026-10-17). The job is "benchmarks (<os>)" here, "bench (<os>)" in benchmarks.yml and
          # "benchmarks / bench (<os>)" in release.yml.
          found=0
          for id in $(for workflow in pipeline.yml release.yml benchmarks.yml; do
                        gh run list --workflow "$workflow" --branch master --status completed --limit 30 --json databaseId -q '.[].databaseId' 2> /dev/null || true
                      done | sort -rn); do
            conclusion=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
              | jq -rs --arg os "$BENCH_RUNNER" \
                  '[.[].jobs[] | select((.name | split(" / ") | last) as $n | ($n == "benchmarks (\($os))" or $n == "bench (\($os))")) | .conclusion] | first // ""' || true)
            if [[ "$conclusion" != "success" ]]; then
              continue
            fi
            if gh run download "$id" --name "bench-results-${RUNNER_OS}" --dir "baseline/$id"; then
              found=$((found + 1))
              if (( found >= 10 )); then
                break
              fi
            else
              echo "run $id has no results for ${RUNNER_OS}"
            fi
          done
          echo "Baseline: $found run(s) whose benchmarks passed on ${RUNNER_OS}"
      - name: Regression gate (ADR 0002)
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          # The table goes to the job summary whether the gate passes or not; warnings are in it too.
          status=0
          dotnet run --project benchmarks/Codalus.Benchmarks.Harness -c Release -- compare \
            --results ci-results --baseline baseline --accepted benchmarks/accepted.json --confirm \
            --out "ci-results/regression-${RUNNER_OS}.md" || status=$?
          cat "ci-results/regression-${RUNNER_OS}.md" >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results-${{ runner.os }}
          path: ci-results/
      - name: Stop the run at its first failure
        # The run fails either way: its other jobs stop and free their runners (macOS ones are scarce), and a release's
        # tag still goes (untag runs in a cancelled run too). This job may then show as cancelled: the error names it.
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::error::benchmarks (${{ matrix.os }}) failed: the run's other jobs are cancelled."
          gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" || true

  # A stable release's apt, dnf and zypper repositories and site, built from its own packages and checked; the pages
  # job deploys them once the release is published.
  site:
    needs: [plan, packages]
    if: needs.plan.outputs.kind == 'stable'
    # A called workflow gets no more than its caller grants, and GitHub checks that before any job runs.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      release: v${{ needs.plan.outputs.version }}
      deploy: false
    secrets: inherit

  publish:
    needs: [plan, test, smoke, packages, update, benchmarks, site]
    # Every gate passed: CI, the packages and the self-update for both kinds, the benchmarks and the site too for a
    # stable release.
    if: >-
      !cancelled() && needs.plan.outputs.publish == 'true'
      && needs.test.result == 'success' && needs.smoke.result == 'success' && needs.packages.result == 'success'
      && needs.update.result == 'success'
      && (needs.plan.outputs.kind == 'nightly' || (needs.benchmarks.result == 'success' && needs.site.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read # the site's address, to keep the nightly it serves
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: downloaded
      # "Re-run failed jobs" skips plan, and untag removed its tag when the first attempt failed: the release would find
      # no tag (develop run 40495180740). Tag again here. The token may tag only a commit whose workflow files match the
      # default branch's, so once the branch has moved on with workflow changes this fails: "Re-run all jobs" then.
      - name: Tag the commit again (a re-run of failed jobs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.plan.outputs.version }}"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1 \
            || gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash eng/publish-release.sh "${{ needs.plan.outputs.kind }}" "${{ needs.plan.outputs.version }}" "$GITHUB_SHA" downloaded
      # Pages holds only the repositories' metadata and the packages come from their release, so the nightly the site's
      # nightly channel serves (packages.txt, eng/linux-repos.sh) stays until a stable release redeploys the site.
      - name: Keep the newest 14 nightlies, and the one the site serves
        if: needs.plan.outputs.kind == 'nightly'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # The release is out by now: tidying up mustn't fail the job, which would untag it.
        continue-on-error: true
        run: |
          if ! site="$(gh api "repos/$GITHUB_REPOSITORY/pages" -q .html_url)" \
            || ! served="$(curl -fsSL "https://$(sed -e 's|^[a-z]*://||' -e 's|/*$||' <<< "$site")/packages.txt")"; then
            echo "::warning::Couldn't read the site's packages.txt, so no nightly is deleted this time."
            exit 0
          fi
          keep="$(awk '$1 == "nightly" { print $2 }' <<< "$served")"
          gh release list --limit 200 --json tagName -q '.[].tagName' | grep -E -- '-nightly\.' | sort -rV | tail -n +15 \
            | { grep -vxF -- "${keep:-none}" || true; } | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done

  untag:
    needs: [plan, publish]
    # Whenever the release wasn't published: a gate failed, or was cancelled (a runner never acquired, which is neither
    # failure() nor cancelled(): 0.2.1's first run kept its tag that way), or the run was.
    if: always() && needs.plan.outputs.publish == 'true' && needs.publish.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove the tag of a release that was not published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.plan.outputs.version }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true

  # After a stable release is published, in this order: the site with the repositories (the Pages artifact the site
  # gate uploaded), the AUR package, and develop last. The plugin SDK's NuGet packages go beside the site and the AUR.
  pages:
    needs: [plan, publish]
    if: needs.plan.outputs.kind == 'stable'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.address.outputs.url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # Pages reports http:// for a project site under its owner's custom domain, though the site is served over HTTPS.
      - id: address
        shell: bash
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "url=https://${url#*://}" >> "$GITHUB_OUTPUT"

  aur:
    needs: [plan, pages]
    runs-on: ubuntu-latest
    steps:
      - name: Push the AUR package (codalus-bin)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # The maintainer's AUR account key (a repository secret). Without it the package is on the release page only.
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY isn't set: codalus-bin $VERSION is attached to the release, not pushed to the AUR."
            exit 0
          fi
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" -p "aur-codalus-bin-$VERSION.zip" -D package
          unzip -q "package/aur-codalus-bin-$VERSION.zip" -d package
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2> /dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone -q ssh://aur@aur.archlinux.org/codalus-bin.git aur
          cp package/PKGBUILD package/.SRCINFO aur/
          cd aur
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || { git commit -q -m "Update to $VERSION"; git push -q origin HEAD:master; }

  # The plugin SDK on nuget.org: Codalus.Plugins.Abstractions, Codalus.Plugins.Testing and Codalus.Templates. Each has a
  # version of its own, not the IDE's, and a version already on nuget.org is skipped, so a release pushes only the
  # packages whose version it changed. No API key is stored: nuget.org's trusted publishing trades the job's GitHub OIDC
  # token for a key valid for an hour, under a policy for this repository, pipeline.yml and the environment nuget
  # (docs/release/releasing.md, "nuget.org"). NUGET_USER is the nuget.org account the policy belongs to; without it
  # the packages are packed and not pushed.
  nuget:
    needs: [plan, publish]
    if: needs.plan.outputs.kind == 'stable'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # the OIDC token nuget.org trades for an API key
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Pack the plugin SDK
        shell: bash
        run: |
          for project in Codalus.Plugins.Abstractions Codalus.Plugins.Testing Codalus.Templates; do
            dotnet pack "src/$project/$project.csproj" -c Release -o artifacts/nuget
          done
      - id: account
        name: The nuget.org account
        shell: bash
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::notice::NUGET_USER isn't set: the plugin SDK's packages are packed, not pushed to nuget.org."
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
      # Right before the push: the key lasts an hour.
      - id: login
        if: steps.account.outputs.push == 'true'
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push the plugin SDK to nuget.org
        if: steps.account.outputs.push == 'true'
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  # Last: develop takes in master (a release branch's fixes, a hotfix) and moves past the release, once everything is
  # out; develop keeps its VERSION, already moved on when the release branch was cut. The "protect" ruleset lets
  # develop change only through a pull request, so the job opens one and merges it (it needs no approval, and the
  # repository lets GitHub Actions create pull requests). The workflow token's pull request and merge start no run,
  # so they make no CI run and no nightly; master's content already passed this release's gates. With no run, the
  # pull request never reports ci, so the job posts it on the branch's head itself, as GitHub Actions (the source the
  # ruleset requires): GitHub offers no Actions bypass for a repository owned by a user.
  finish:
    needs: [plan, aur, nuget]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write # the branch's ci check
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Move develop past the release (and take in master)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED: ${{ needs.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop master
          git switch -c develop-after-release origin/develop
          if ! git merge --no-edit origin/master; then
            # A hotfix released from master (or a VERSION change on both sides): develop's VERSION wins (the bump below
            # moves it past the release); any other conflict needs the maintainer.
            if [[ "$(git diff --name-only --diff-filter=U)" == "VERSION" ]]; then
              git checkout --ours VERSION && git add VERSION && git commit --no-edit
            else
              echo "::error::Merging master into develop conflicts beyond VERSION; merge it by hand." && exit 1
            fi
          fi
          next="$(dotnet run --project eng/Codalus.Release -- bump --after "$RELEASED")"
          if ! git diff --quiet VERSION; then
            git commit -m "Start $next after the $RELEASED release" VERSION
          fi
          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/develop)" ]]; then
            echo "develop already contains the release and its VERSION is past it." && exit 0
          fi
          # A re-run replaces the branch and reuses its pull request.
          branch="develop-after/$RELEASED"
          git push --force origin "HEAD:refs/heads/$branch"
          gh api "repos/$GITHUB_REPOSITORY/check-runs" -f name=ci -f head_sha="$(git rev-parse HEAD)" \
            -f status=completed -f conclusion=success -f 'output[title]=Passed in the release run' \
            -f "output[summary]=master passed every gate of the $RELEASED release run, ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}." > /dev/null
          if [[ -z "$(gh pr list --head "$branch" --base develop --state open --json number --jq '.[].number')" ]]; then
            gh pr create --head "$branch" --base develop --title "Start $next after the $RELEASED release" \
              --body "Merges \`master\` into \`develop\` after the $RELEASED release and moves \`VERSION\` to $next. Opened and merged by the release run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          fi
          # GitHub may still be working out whether the new pull request merges.
          for attempt in 1 2 3 4 5; do
            gh pr merge "$branch" --merge --match-head-commit "$(git rev-parse HEAD)" && break
            [[ $attempt == 5 ]] && echo "::error::Couldn't merge $branch into develop; merge its pull request by hand." && exit 1
            sleep 15
          done
          git push origin --delete "$branch" || true
