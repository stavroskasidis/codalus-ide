name: Pipeline

# A probe, on the scratch branch only (never merged): does a runner that goes silent leave its live output behind?
# Each job writes what a test shard writes, with the live-output action uploading it; "lost" jobs then power their
# runner off, "clean" jobs end normally (the action's post step removes the upload).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.os }}, ${{ matrix.end }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        end: [lost, clean]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/live-output
        with:
          name: live-${{ matrix.os }}-${{ matrix.end }}-${{ github.run_attempt }}
          interval: "10"
      - name: A shard's output for a minute, then the runner goes (lost) or the job ends (clean)
        shell: bash
        env:
          END: ${{ matrix.end }}
        run: |
          mkdir -p artifacts/test-results/probe
          for i in $(seq 1 12); do
            echo "passed Probe.Tests.Test$i ($(date -u +%H:%M:%S))" >> artifacts/test-results/probe/console.txt
            echo "$(date -u +%H:%M:%S) free=$((100 - i))% available=1000M swap=0M" >> artifacts/test-results/probe/memory.txt
            sleep 5
          done
          if [[ "$END" == lost ]]; then
            echo "The runner goes now."
            case "$RUNNER_OS" in
              Windows) powershell -NoProfile -Command "Stop-Computer -Force" ;;
              *) sudo shutdown -h now || sudo poweroff ;;
            esac
            sleep 900
          fi
