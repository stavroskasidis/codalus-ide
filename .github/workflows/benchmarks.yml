name: Benchmarks

# Runs the M0 UI-stack benchmarks on GitHub-hosted runners. These are VMs without GPUs (Linux uses
# Mesa lavapipe for Vulkan under Xvfb), so the numbers are indicative only; authoritative numbers come
# from reference hardware (docs/adr/0002-performance-budgets.md). Same cost policy as CI: PRs to main,
# nightly and manual runs.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CARGO_TERM_COLOR: always

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Linux dependencies (GPUI build, Xvfb, software Vulkan, VS Code)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libssl-dev \
            xvfb mesa-vulkan-drivers clang zlib1g-dev
          curl -fsSL -o /tmp/code.deb "https://update.code.visualstudio.com/latest/linux-deb-x64/stable"
          sudo apt-get install -y /tmp/code.deb
      - name: macOS VS Code
        if: runner.os == 'macOS'
        run: brew install --cask visual-studio-code
      - name: Windows VS Code
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vscode -y --no-progress
          "DAEDALUS_BENCH_VSCODE=C:\Program Files\Microsoft VS Code\Code.exe" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/gpui
      - name: Generate fixtures
        run: dotnet run --project benchmarks/Daedalus.Benchmarks.FixtureGen -c Release -- all samples
      - name: Publish prototypes and the language service host
        shell: bash
        run: |
          rid=$(dotnet --info | awk '/RID:/ {print $2; exit}')
          dotnet publish src/Daedalus.LanguageServices.Host -c Release -r "$rid" --self-contained false -p:PublishReadyToRun=true -o artifacts/lshost
          dotnet publish spikes/avalonia/Daedalus.Spike.Avalonia -c Release -r "$rid" -o artifacts/spike-a
          (cd spikes/gpui && rustup show active-toolchain >/dev/null 2>&1 || rustup toolchain install; cargo build --release --locked)
          mkdir -p artifacts/spike-b
          cp spikes/gpui/target/release/daedalus-spike-gpui* artifacts/spike-b/ 2>/dev/null || true
          rm -f artifacts/spike-b/*.d artifacts/spike-b/*.pdb
          cp -r artifacts/lshost artifacts/spike-a/lshost
          cp -r artifacts/lshost artifacts/spike-b/lshost
      - name: Run benchmarks
        shell: bash
        run: |
          cmd="dotnet run --project benchmarks/Daedalus.Benchmarks.Harness -c Release -- run \
            --targets avalonia,gpui,vscode --scenarios cold-start,editor-100k,self-driven,binary-size --runs 3"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" $cmd
          else
            $cmd
          fi
      - name: Report
        if: always()
        run: dotnet run --project benchmarks/Daedalus.Benchmarks.Harness -c Release -- report --out benchmarks/results/summary-${{ runner.os }}.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-${{ runner.os }}
          path: benchmarks/results/
