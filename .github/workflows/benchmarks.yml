name: Benchmarks

# Runs the benchmarks on GitHub-hosted runners. These are GPU-less VMs (Linux runs under Xvfb), so the
# numbers are indicative only; authoritative numbers come from reference hardware
# (docs/adr/0002-performance-budgets.md). Nightly on master and on manual dispatch.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read # download earlier nightly results as the regression baseline

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Linux dependencies (Xvfb, Native AOT toolchain, VS Code)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb clang zlib1g-dev libfontconfig1
          curl -fsSL -o /tmp/code.deb "https://update.code.visualstudio.com/latest/linux-deb-x64/stable"
          sudo apt-get install -y /tmp/code.deb
      - name: macOS VS Code
        if: runner.os == 'macOS'
        run: brew install --cask visual-studio-code
      - name: Windows VS Code
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vscode -y --no-progress
          "DAEDALUS_BENCH_VSCODE=C:\Program Files\Microsoft VS Code\Code.exe" >> $env:GITHUB_ENV
      - name: Generate fixtures
        run: dotnet run --project benchmarks/Daedalus.Benchmarks.FixtureGen -c Release -- all samples
      - name: Publish the shell, the spike and the language service host
        shell: bash
        run: |
          rid=$(dotnet --info | awk '/RID:/ {print $2; exit}')
          dotnet publish src/Daedalus.Shell -c Release -r "$rid" -o artifacts/shell
          dotnet publish src/Daedalus.LanguageServices.Host -c Release -r "$rid" --self-contained false -p:PublishReadyToRun=true -o artifacts/lshost
          dotnet publish spikes/avalonia/Daedalus.Spike.Avalonia -c Release -r "$rid" -o artifacts/spike-a
          cp -r artifacts/lshost artifacts/spike-a/lshost
      - name: Run benchmarks
        shell: bash
        run: |
          cmd="dotnet run --project benchmarks/Daedalus.Benchmarks.Harness -c Release -- run --results ci-results \
            --targets shell,avalonia,vscode --scenarios cold-start,editor-100k,self-driven,binary-size --runs 3"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" $cmd
          else
            $cmd
          fi
      - name: Report
        if: always()
        run: dotnet run --project benchmarks/Daedalus.Benchmarks.Harness -c Release -- report --results ci-results --out ci-results/summary-${{ runner.os }}.md
      - name: Download the baseline (last 10 successful nightly runs)
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline
          for id in $(gh run list --workflow benchmarks.yml --branch master --status success --limit 10 --json databaseId -q '.[].databaseId'); do
            gh run download "$id" --name "bench-results-${RUNNER_OS}" --dir "baseline/$id" || echo "run $id has no results for ${RUNNER_OS}"
          done
      - name: Regression gate (ADR 0002)
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          cmd="dotnet run --project benchmarks/Daedalus.Benchmarks.Harness -c Release -- compare \
            --results ci-results --baseline baseline --confirm --out ci-results/regression-${RUNNER_OS}.md"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" $cmd
          else
            $cmd
          fi
          cat ci-results/regression-${RUNNER_OS}.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-${{ runner.os }}
          path: ci-results/
