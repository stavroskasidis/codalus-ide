name: Release packages

# Builds the per-OS packages with eng/package.sh (ADR 0009) and uploads them as workflow artifacts. Manual only: on the
# private repo's free plan this costs about as much as a full CI matrix run. Creating a GitHub release from the
# artifacts is a manual step (see docs/release/go-public-checklist.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp (e.g. 0.1.0)
        required: true
        default: 0.1.0-preview.1

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          # The smoke test's .NET 11 step (M30): keep it in step with samples/Net11/global.json.
          dotnet-version: 11.0.100-rc.1.26425.128
      - name: Native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Package
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then export PATH="$PATH:/c/Program Files (x86)/Microsoft Visual Studio/Installer"; fi
          bash eng/package.sh "${{ inputs.version }}"
      # Installs the packages it just built (outside the checkout) and runs the smoke test on them, with their bundled
      # debugger: the Windows zip, the macOS .app from the dmg, the Linux .deb (and --version of the tar.gz and AppImage).
      - name: Display for the smoke test (Xvfb)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends xvfb
      - name: Smoke test the packages
        shell: bash
        run: bash eng/smoke-test.sh --packages artifacts/packages artifacts/smoke-test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-${{ runner.os }}
          path: artifacts/smoke-test/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: artifacts/packages/
          if-no-files-found: error
