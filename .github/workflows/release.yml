name: Release

# A stable release from master (M31, ADR 0028, D20/D21): every merge from develop (and every hotfix) publishes
# v<VERSION>, the version in the VERSION file. The release fails if that tag exists already. It carries the installers
# for every platform, the update feeds (M32), the winget manifests and checksums, with notes generated from the commits
# since the previous stable release. Afterwards develop moves past the released version (and takes in a hotfix).
# While the repository is private this runs on manual dispatch only; the push trigger switches on by itself once the
# repository is public. A dry run builds and tests everything and publishes nothing.
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test without publishing
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - id: plan
        shell: bash
        run: |
          version="$(dotnet run --project eng/DaedalusStudio.Release -- version stable)"
          dotnet run --project eng/DaedalusStudio.Release -- check-tag "$version"
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Release $version from $(git rev-parse --short HEAD) (previous: ${previous:-none})" >> "$GITHUB_STEP_SUMMARY"

  packages:
    needs: plan
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      kind: stable
      ref: ${{ needs.plan.outputs.ref }}
      previous: ${{ needs.plan.outputs.previous }}
      arm64: ${{ !github.event.repository.private }}
    secrets: inherit

  publish:
    needs: [plan, packages]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: downloaded
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash eng/publish-release.sh stable "${{ needs.plan.outputs.version }}" "${{ needs.plan.outputs.ref }}" downloaded
      - name: Move develop past the release (and take in a hotfix)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop master
          git switch -c develop-after-release origin/develop
          if ! git merge --no-edit origin/master; then
            # A hotfix released from master: develop's VERSION wins (the bump below moves it past the release); any
            # other conflict needs the maintainer.
            if [[ "$(git diff --name-only --diff-filter=U)" == "VERSION" ]]; then
              git checkout --ours VERSION && git add VERSION && git commit --no-edit
            else
              echo "::error::Merging master into develop conflicts beyond VERSION; merge it by hand." && exit 1
            fi
          fi
          next="$(dotnet run --project eng/DaedalusStudio.Release -- bump --after "${{ needs.plan.outputs.version }}")"
          if ! git diff --quiet VERSION; then
            git commit -m "Start $next after the ${{ needs.plan.outputs.version }} release" VERSION
          fi
          git push origin HEAD:develop

  linux-repositories:
    needs: publish
    # GitHub Pages needs a public repository on the free plan (D20): until then the apt and dnf repositories wait.
    if: ${{ !github.event.repository.private }}
    uses: ./.github/workflows/linux-repos.yml
    secrets: inherit
