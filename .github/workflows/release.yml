name: Release

# A stable release from master (M31, ADR 0028, D20/D21): every merge from develop (and every hotfix) publishes
# v<VERSION>, the version in the VERSION file. The release fails if that tag exists already. It carries the installers
# for every platform, the update feeds (M32), the winget manifests and checksums, with notes generated from the commits
# since the previous stable release. Afterwards develop moves past the released version (and takes in a hotfix).
# While the repository is private this runs on manual dispatch only; the push trigger switches on by itself once the
# repository is public. A dry run builds and tests everything and publishes nothing.
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test without publishing
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - id: plan
        shell: bash
        run: |
          version="$(dotnet run --project eng/DaedalusStudio.Release -- version stable)"
          dotnet run --project eng/DaedalusStudio.Release -- check-tag "$version"
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Release $version from $(git rev-parse --short HEAD) (previous: ${previous:-none})" >> "$GITHUB_STEP_SUMMARY"
      # The tag comes first, while the commit is still the branch's head: the workflow token may create a tag only on
      # a commit whose workflow files match the default branch's (otherwise it needs the workflows permission, which
      # it can't have), and the branch may move on with workflow changes during the build. A failed run removes it.
      - name: Tag the commit
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v${{ steps.plan.outputs.version }}" -f sha="${{ steps.plan.outputs.ref }}" > /dev/null

  packages:
    needs: plan
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      kind: stable
      ref: ${{ needs.plan.outputs.ref }}
      previous: ${{ needs.plan.outputs.previous }}
      arm64: ${{ !github.event.repository.private }}
    secrets: inherit

  publish:
    needs: [plan, packages]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: downloaded
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash eng/publish-release.sh stable "${{ needs.plan.outputs.version }}" "${{ needs.plan.outputs.ref }}" downloaded
      - name: Move develop past the release (and take in a hotfix)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop master
          git switch -c develop-after-release origin/develop
          if ! git merge --no-edit origin/master; then
            # A hotfix released from master: develop's VERSION wins (the bump below moves it past the release); any
            # other conflict needs the maintainer.
            if [[ "$(git diff --name-only --diff-filter=U)" == "VERSION" ]]; then
              git checkout --ours VERSION && git add VERSION && git commit --no-edit
            else
              echo "::error::Merging master into develop conflicts beyond VERSION; merge it by hand." && exit 1
            fi
          fi
          next="$(dotnet run --project eng/DaedalusStudio.Release -- bump --after "${{ needs.plan.outputs.version }}")"
          if ! git diff --quiet VERSION; then
            git commit -m "Start $next after the ${{ needs.plan.outputs.version }} release" VERSION
          fi
          git push origin HEAD:develop

  untag:
    needs: [plan, packages, publish]
    if: ${{ failure() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove the tag of a release that was not published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.plan.outputs.version }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true

  aur:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Push the AUR package (daedalus-studio-bin)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # The maintainer's AUR account key (a repository secret). Without it the package is on the release page only.
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY isn't set: daedalus-studio-bin $VERSION is attached to the release, not pushed to the AUR."
            exit 0
          fi
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" -p "aur-daedalus-studio-bin-$VERSION.zip" -D package
          unzip -q "package/aur-daedalus-studio-bin-$VERSION.zip" -d package
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2> /dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone -q ssh://aur@aur.archlinux.org/daedalus-studio-bin.git aur
          cp package/PKGBUILD package/.SRCINFO aur/
          cd aur
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || { git commit -q -m "Update to $VERSION"; git push -q origin HEAD:master; }

  linux-repositories:
    needs: publish
    # GitHub Pages needs a public repository on the free plan (D20): until then the apt and dnf repositories wait.
    if: ${{ !github.event.repository.private }}
    # Only master deploys the site (the github-pages environment allows master), and a release runs on master.
    # A called workflow gets no more than its caller grants, and GitHub checks that before any job runs.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/linux-repos.yml
    secrets: inherit
