name: Release

# Releases (M31, ADR 0028, D20/D21), stable and nightly in one workflow; the packages come from packages.yml.
# - Stable: every merge from develop into master (and every hotfix) publishes v<VERSION>, the version in the VERSION
#   file; each completed milestone is one (a minor release). The release fails if that tag exists already. It carries
#   the installers for every platform, the update feeds (M32), the winget manifests and checksums, with notes generated
#   from the commits since the previous stable release. Afterwards develop moves past the released version (and takes
#   in a hotfix), the AUR package is pushed, and the site with the apt and dnf repositories is deployed.
# - Nightly: develop at night, when it changed since the last nightly, published as a GitHub prerelease
#   v<VERSION>-nightly.<date>.<run> with the commits since the previous nightly as its notes. The newest 14 are kept.
# Manual dispatch chooses the kind; a dry run (the default) builds and tests everything and publishes nothing.
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: stable (from master) or nightly (from develop)
        type: choice
        options: [nightly, stable]
        default: nightly
      dry_run:
        description: Build and test without publishing
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'push' && 'stable' || inputs.kind }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  KIND: ${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'push' && 'stable' || inputs.kind }}

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
      previous: ${{ steps.plan.outputs.previous }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.KIND == 'stable' && 'master' || 'develop' }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - id: plan
        shell: bash
        run: |
          ref="$(git rev-parse HEAD)"
          build=true
          if [[ "$KIND" == "stable" ]]; then
            version="$(dotnet run --project eng/Codalus.Release -- version stable)"
            dotnet run --project eng/Codalus.Release -- check-tag "$version"
            previous="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          else
            previous="$(git tag --list 'v*-nightly.*' --sort=-v:refname | head -n 1)"
            # The schedule skips a night when develop hasn't changed since the last nightly.
            if [[ "${{ github.event_name }}" == "schedule" && -n "$previous" && "$(git rev-parse "$previous^{commit}")" == "$ref" ]]; then
              build=false
            fi
            version="$(dotnet run --project eng/Codalus.Release -- version nightly --run "${{ github.run_number }}")"
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Release ($KIND) $version from $(git rev-parse --short HEAD) (previous: ${previous:-none}; build: $build)" >> "$GITHUB_STEP_SUMMARY"
      # The tag comes first, while the commit is still the branch's head: the workflow token may create a tag only on
      # a commit whose workflow files match the default branch's (otherwise it needs the workflows permission, which
      # it can't have), and the branch may move on with workflow changes during the build. A failed run removes it.
      - name: Tag the commit
        if: steps.plan.outputs.build == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v${{ steps.plan.outputs.version }}" -f sha="${{ steps.plan.outputs.ref }}" > /dev/null

  packages:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      kind: ${{ needs.plan.outputs.kind }}
      ref: ${{ needs.plan.outputs.ref }}
      previous: ${{ needs.plan.outputs.previous }}
      arm64: ${{ !github.event.repository.private }}
    secrets: inherit

  publish:
    needs: [plan, packages]
    if: needs.plan.outputs.build == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: downloaded
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash eng/publish-release.sh "${{ needs.plan.outputs.kind }}" "${{ needs.plan.outputs.version }}" "${{ needs.plan.outputs.ref }}" downloaded
      - name: Keep the newest 14 nightlies
        if: needs.plan.outputs.kind == 'nightly'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName -q '.[].tagName' | grep -E -- '-nightly\.' | sort -rV | tail -n +15 \
            | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
      - name: Move develop past the release (and take in a hotfix)
        if: needs.plan.outputs.kind == 'stable'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop master
          git switch -c develop-after-release origin/develop
          if ! git merge --no-edit origin/master; then
            # A hotfix released from master: develop's VERSION wins (the bump below moves it past the release); any
            # other conflict needs the maintainer.
            if [[ "$(git diff --name-only --diff-filter=U)" == "VERSION" ]]; then
              git checkout --ours VERSION && git add VERSION && git commit --no-edit
            else
              echo "::error::Merging master into develop conflicts beyond VERSION; merge it by hand." && exit 1
            fi
          fi
          next="$(dotnet run --project eng/Codalus.Release -- bump --after "${{ needs.plan.outputs.version }}")"
          if ! git diff --quiet VERSION; then
            git commit -m "Start $next after the ${{ needs.plan.outputs.version }} release" VERSION
          fi
          git push origin HEAD:develop

  untag:
    needs: [plan, packages, publish]
    if: failure() && needs.plan.outputs.build == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - name: Remove the tag of a release that was not published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.plan.outputs.version }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true

  aur:
    needs: [plan, publish]
    if: needs.plan.outputs.kind == 'stable'
    runs-on: ubuntu-latest
    steps:
      - name: Push the AUR package (codalus-bin)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # The maintainer's AUR account key (a repository secret). Without it the package is on the release page only.
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY isn't set: codalus-bin $VERSION is attached to the release, not pushed to the AUR."
            exit 0
          fi
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" -p "aur-codalus-bin-$VERSION.zip" -D package
          unzip -q "package/aur-codalus-bin-$VERSION.zip" -d package
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2> /dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone -q ssh://aur@aur.archlinux.org/codalus-bin.git aur
          cp package/PKGBUILD package/.SRCINFO aur/
          cd aur
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || { git commit -q -m "Update to $VERSION"; git push -q origin HEAD:master; }

  linux-repositories:
    needs: [plan, publish]
    # GitHub Pages needs a public repository on the free plan (D20). Only master deploys the site (the github-pages
    # environment allows master), so only a stable release, which runs on master, does; nightlies don't.
    if: needs.plan.outputs.kind == 'stable' && !github.event.repository.private
    # A called workflow gets no more than its caller grants, and GitHub checks that before any job runs.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/linux-repos.yml
    secrets: inherit
