# Flatpak manifest (ADR 0009): packages the Linux release tarball. Not built in CI yet (TODO(issue)): an IDE needs the
# host's .NET SDK and git, so it runs with --filesystem=host and talks to host tools through flatpak-spawn; that needs
# testing before it is published on Flathub.
app-id: io.github.stavroskasidis.DaedalusStudio
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: daedalus
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: daedalus-studio
    buildsystem: simple
    build-commands:
      - cp -R daedalus-studio /app/daedalus-studio
      - mkdir -p /app/bin && ln -s /app/daedalus-studio/daedalus /app/bin/daedalus
      - install -Dm644 daedalus-studio.desktop /app/share/applications/io.github.stavroskasidis.DaedalusStudio.desktop
      - install -Dm644 daedalus-256.png /app/share/icons/hicolor/256x256/apps/io.github.stavroskasidis.DaedalusStudio.png
    sources:
      - type: archive
        path: ../../../artifacts/packages/daedalus-studio-0.1.0-linux-x64.tar.gz
        strip-components: 0
      - type: file
        path: ../linux/daedalus-studio.desktop
      - type: file
        path: ../../../assets/logo/png/daedalus-256.png
