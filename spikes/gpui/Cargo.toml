[package]
name = "daedalus-spike-gpui"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "M0 UI stack spike, prototype B: Rust + GPUI (GPUI Kit) talking to daedalus-lshost over JSON-RPC."

[[bin]]
name = "daedalus-spike-gpui"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "=0.7.1", default-features = false, features = ["component", "assets", "tree-sitter-csharp"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lsp-types = "0.97"
futures = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
# Adds EditorState::refresh_semantic_tokens; see vendor/PATCHES.md.
gpui-base = { path = "vendor/gpui-base" }
