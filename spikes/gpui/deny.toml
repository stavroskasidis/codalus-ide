# cargo-deny policy for the GPUI spike. The repository rule: every dependency must use an
# OSI-approved license compatible with MIT (see THIRD-PARTY-NOTICES.md).
[graph]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
]

# Pending a maintainer decision at the M0 checkpoint (docs/adr/0001-ui-stack.md, "Licensing").
# All arrive transitively through gpui-pre and are only acceptable if prototype B is chosen
# and the maintainer approves them.
exceptions = [
    # MPL-2.0: OSI-approved, file-level copyleft (modified MPL files must stay MPL; linking is fine).
    { allow = ["MPL-2.0"], crate = "option-ext" }, # via dirs-sys <- dirs <- shellexpand (all OSes)
    { allow = ["MPL-2.0"], crate = "dwrote" },     # DirectWrite bindings via zed-font-kit
    { allow = ["MPL-2.0"], crate = "cbindgen" },   # build-time tool only (macOS), not distributed
    # bzip2-1.0.6: permissive BSD-style, but NOT on the OSI list. Via async-compression.
    { allow = ["bzip2-1.0.6"], crate = "libbz2-rs-sys" },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
